name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          mkdir -p app/src/main/java/com/marchwar/meet app/src/main/res/layout app/src/main/res/values
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }" > build.gradle
          printf "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }\nandroid { namespace 'com.marchwar.meet'; compileSdk 34; defaultConfig { applicationId 'com.marchwar.meet'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }\ndependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          printf "<manifest xmlns:android='http://schemas.android.com/apk/res/android'><application android:label='Marchwar Meet'><activity android:name='.MainActivity' android:exported='true'><intent-filter><action android:name='android.intent.action.MAIN'/><category android:name='android.intent.category.LAUNCHER'/></intent-filter></activity></application></manifest>" > app/src/main/AndroidManifest.xml
          printf "<resources><string name='app_name'>Marchwar Meet</string></resources>" > app/src/main/res/values/strings.xml
          printf "<LinearLayout xmlns:android='http://schemas.android.com/apk/res/android' android:layout_width='match_parent' android:layout_height='match_parent' android:gravity='center' android:orientation='vertical'><TextView android:layout_width='wrap_content' android:layout_height='wrap_content' android:text='Jai Marchwar Samaj'/><Button android:id='@+id/btn' android:layout_width='wrap_content' android:layout_height='wrap_content' android:text='Click'/></LinearLayout>" > app/src/main/res/layout/activity_main.xml
          printf "package com.marchwar.meet\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\nimport android.widget.Button\nimport android.widget.Toast\nclass MainActivity: AppCompatActivity() { override fun onCreate(s: Bundle?) { super.onCreate(s); setContentView(R.layout.activity_main); findViewById<Button>(R.id.btn).setOnClickListener { Toast.makeText(this, \"Jai Marchwar!\", Toast.LENGTH_LONG).show() } } }" > app/src/main/java/com/marchwar/meet/MainActivity.kt
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/app-debug.apk
