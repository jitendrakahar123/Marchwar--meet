name: Build Marchwar Meet APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/marchwar/meet
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.marchwar.meet'
              compileSdk 34
              defaultConfig {
                  applicationId "com.marchwar.meet"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="Marchwar Meet" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Marchwar Meet</string></resources>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp" android:background="#FFF8E1">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Marchwar Meet" android:textSize="32sp" android:textStyle="bold" android:textColor="#6A1B9A"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Jitendra Kahar - Marchwar Samaj" android:layout_marginTop="8dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Shaadi | Rishtey | Community" android:textSize="18sp" android:layout_marginTop="32dp"/>
              <Button android:id="@+id/btn" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Welcome to Marchwar Meet" android:layout_marginTop="40dp"/>
          </LinearLayout>
          EOF
          cat > app/src/main/java/com/marchwar/meet/MainActivity.kt <<'EOF'
          package com.marchwar.meet
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.Toast
          import android.widget.Button
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<Button>(R.id.btn).setOnClickListener {
                      Toast.makeText(this, "Jai Marchwar Samaj!", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF
          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Marchwar-Meet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
